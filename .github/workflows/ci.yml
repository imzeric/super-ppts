name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - run: corepack enable && corepack prepare pnpm@10.33.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
        working-directory: worker
      - run: python -m pytest tests -q
        working-directory: worker
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable && corepack prepare pnpm@10.33.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r worker/requirements.txt
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
          PYTHON: python
          AI_API_KEY: ""
          AI_BASE_URL: ""
          AI_MODEL: ""
          AI_TEXT_API_KEY: ""
          AI_VISION_API_KEY: ""
          AI_IMAGE_API_KEY: ""
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-smoke.sh
        env:
          INTERNAL_SERVICE_TOKEN: ci-demo-token
          HOST_PORT: "3010"
          COMPOSE_PROJECT_NAME: super-ppts-ci-${{ github.run_id }}-${{ github.run_attempt }}
